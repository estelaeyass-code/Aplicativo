<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KICKS // Loja de Sneakers Premium</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-orange-500 selection:text-white">

    <!-- Cabeçalho / Navegação -->
    <header class="border-b border-slate-800 bg-slate-900/80 backdrop-blur-md sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between gap-4">
            <a href="loja.html" class="flex items-center gap-2 group">
                <div class="bg-gradient-to-tr from-orange-600 to-amber-500 p-2 rounded-xl group-hover:scale-105 transition duration-300 shadow-lg shadow-orange-500/20">
                    <i data-lucide="footprints" class="w-6 h-6 text-white"></i>
                </div>
                <span class="text-xl font-extrabold tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-white via-slate-200 to-slate-400">KICKS</span>
            </a>

            <!-- Campo de Busca -->
            <div class="flex-1 max-w-md hidden md:block">
                <div class="relative">
                    <i data-lucide="search" class="w-4 h-4 text-slate-500 absolute left-3.5 top-3"></i>
                    <input type="text" id="search-input" onkeyup="filterProducts()" placeholder="Buscar tênis por nome ou marca..." class="w-full bg-slate-950 border border-slate-800 rounded-full pl-10 pr-4 py-2 text-sm text-slate-200 placeholder-slate-500 focus:outline-none focus:border-orange-500 transition">
                </div>
            </div>

            <div class="flex items-center gap-3">
                <!-- Perfil -->
                <a href="profile.html" class="flex items-center gap-2 text-slate-300 hover:text-white font-medium text-sm border border-slate-800 bg-slate-900 px-3 py-1.5 rounded-xl hover:border-slate-700 transition">
                    <i data-lucide="user" class="w-4 h-4 text-orange-500"></i>
                    <span id="user-display-name">Meu Perfil</span>
                </a>

                <!-- Carrinho -->
                <button onclick="toggleCart()" class="relative bg-orange-600 hover:bg-orange-500 text-white px-4 py-2 rounded-xl font-bold text-sm flex items-center gap-2 shadow-lg shadow-orange-600/20 transition active:scale-95">
                    <i data-lucide="shopping-bag" class="w-4 h-4"></i>
                    <span class="hidden sm:inline">Carrinho</span>
                    <span id="cart-count" class="bg-white text-orange-600 text-xs font-black rounded-full px-2 py-0.5 min-w-[20px] text-center">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Banner Hero -->
    <section class="max-w-7xl mx-auto px-4 pt-8 w-full">
        <div class="bg-gradient-to-r from-orange-600 to-amber-600 rounded-3xl p-8 md:p-12 relative overflow-hidden shadow-2xl">
            <div class="relative z-10 max-w-xl">
                <span class="bg-black/30 backdrop-blur-md text-white text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full mb-4 inline-block">Coleção Exclusiva 2026</span>
                <h1 class="text-3xl md:text-5xl font-extrabold text-white leading-tight mb-4">Eleve o seu estilo com os Sneakers mais desejados.</h1>
                <p class="text-orange-100 text-sm md:text-base mb-6">Originalidade garantida, edições limitadas e entrega rápida para todo o país.</p>
            </div>
            <i data-lucide="footprints" class="w-96 h-96 text-white/10 absolute -right-10 -bottom-20 pointer-events-none rotate-12"></i>
        </div>
    </section>

    <!-- Categorias / Filtros -->
    <section class="max-w-7xl mx-auto px-4 py-6 w-full">
        <div class="flex items-center gap-2 overflow-x-auto pb-2 scrollbar-none" id="categories-container">
            <button onclick="filterCategory('all')" class="cat-btn active bg-orange-600 text-white text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap transition">Todos os Tênis</button>
            <button onclick="filterCategory('Nike')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap transition">Nike</button>
            <button onclick="filterCategory('Adidas')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap transition">Adidas</button>
            <button onclick="filterCategory('Jordan')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap transition">Jordan</button>
            <button onclick="filterCategory('New Balance')" class="cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap transition">New Balance</button>
        </div>
    </section>

    <!-- Grelha de Produtos -->
    <main class="max-w-7xl mx-auto px-4 py-4 flex-1 w-full">
        <div id="products-grid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
            <!-- Os ténis vão aparecer aqui dinamicamente -->
        </div>
    </main>

    <!-- Sidebar do Carrinho -->
    <div id="cart-sidebar" class="fixed inset-y-0 right-0 w-full max-w-md bg-slate-900 border-l border-slate-800 z-50 transform translate-x-full transition-transform duration-300 shadow-2xl flex flex-col justify-between">
        <div class="p-6 border-b border-slate-800 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="shopping-bag" class="w-5 h-5 text-orange-500"></i>
                <h2 class="text-lg font-bold">Seu Carrinho</h2>
            </div>
            <button onclick="toggleCart()" class="text-slate-400 hover:text-white transition">
                <i data-lucide="x" class="w-6 h-6"></i>
            </button>
        </div>

        <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4">
            <!-- Itens do carrinho -->
        </div>

        <div class="p-6 border-t border-slate-800 bg-slate-950/50">
            <div class="flex justify-between items-center mb-4">
                <span class="text-slate-400 text-sm font-medium">Subtotal</span>
                <span id="cart-total" class="text-xl font-extrabold text-white">R$ 0,00</span>
            </div>
            <button onclick="checkout()" class="w-full bg-orange-600 hover:bg-orange-500 text-white font-bold py-3.5 rounded-xl transition shadow-lg shadow-orange-600/20 active:scale-95 flex items-center justify-center gap-2">
                <i data-lucide="check-circle" class="w-5 h-5"></i> Finalizar Compra
            </button>
        </div>
    </div>
    <div id="cart-overlay" onclick="toggleCart()" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-40 hidden"></div>

    <!-- Rodapé -->
    <footer class="border-t border-slate-900 py-6 text-center text-xs text-slate-600 mt-12">
        &copy; 2026 KICKS Store. Todos os direitos reservados.
    </footer>

    <!-- Firebase e Lógica da Loja -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDoipkVYlNOArClFhhKyQI02QCYLP4rtWM",
            authDomain: "kicks-642ac.firebaseapp.com",
            projectId: "kicks-642ac",
            storageBucket: "kicks-642ac.firebasestorage.app",
            messagingSenderId: "48841933752",
            appId: "1:48841933752:web:457adf9228738b9901054d"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;

        // Proteção de Rota: Se não estiver logado, envia para o index.html (Login)
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "index.html";
            } else {
                currentUser = user;
                document.getElementById('user-display-name').innerText = user.displayName || user.email.split('@')[0];
            }
        });

        // Lista de Ténis da Loja
        const products = [
            { id: 1, name: "Air Jordan 1 High OG", brand: "Jordan", price: 1499.90, image: "https://images.unsplash.com/photo-1584735935682-2f2b69dff9d2?w=600&auto=format&fit=crop" },
            { id: 2, name: "Nike Dunk Low Retro", brand: "Nike", price: 899.90, image: "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=600&auto=format&fit=crop" },
            { id: 3, name: "Adidas Yeezy Boost 350", brand: "Adidas", price: 1799.90, image: "https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=600&auto=format&fit=crop" },
            { id: 4, name: "New Balance 550", brand: "New Balance", price: 999.90, image: "https://images.unsplash.com/photo-1539185441755-769473a23570?w=600&auto=format&fit=crop" },
            { id: 5, name: "Nike Air Max 90", brand: "Nike", price: 799.90, image: "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600&auto=format&fit=crop" },
            { id: 6, name: "Adidas Forum Low", brand: "Adidas", price: 699.90, image: "https://images.unsplash.com/photo-1552346154-21d32810aba3?w=600&auto=format&fit=crop" }
        ];

        let cart = [];
        let selectedCategory = 'all';

        window.renderProducts = function() {
            const grid = document.getElementById('products-grid');
            const search = document.getElementById('search-input').value.toLowerCase();
            
            grid.innerHTML = '';

            const filtered = products.filter(p => {
                const matchesCat = selectedCategory === 'all' || p.brand === selectedCategory;
                const matchesSearch = p.name.toLowerCase().includes(search) || p.brand.toLowerCase().includes(search);
                return matchesCat && matchesSearch;
            });

            if(filtered.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-12 text-slate-500">Nenhum tênis encontrado.</div>`;
                return;
            }

            filtered.forEach(product => {
                grid.innerHTML += `
                    <div class="bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden hover:border-slate-700 transition duration-300 flex flex-col justify-between group">
                        <div class="relative overflow-hidden aspect-square bg-slate-950">
                            <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500">
                            <span class="absolute top-3 left-3 bg-slate-950/80 backdrop-blur-md text-slate-300 text-[10px] font-extrabold uppercase px-2.5 py-1 rounded-md border border-slate-800">${product.brand}</span>
                        </div>
                        <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                                <h3 class="font-bold text-white text-base mb-1">${product.name}</h3>
                                <p class="text-orange-500 font-extrabold text-lg mb-4">R$ ${product.price.toFixed(2).replace('.', ',')}</p>
                            </div>
                            <button onclick="addToCart(${product.id})" class="w-full bg-slate-800 hover:bg-orange-600 text-slate-200 hover:text-white font-bold py-2.5 rounded-xl transition flex items-center justify-center gap-2 text-xs">
                                <i data-lucide="plus" class="w-4 h-4"></i> Adicionar ao Carrinho
                            </button>
                        </div>
                    </div>
                `;
            });
            if (window.lucide) lucide.createIcons();
        };

        window.addToCart = function(id) {
            const product = products.find(p => p.id === id);
            const item = cart.find(i => i.id === id);

            if (item) {
                item.qty++;
            } else {
                cart.push({ ...product, qty: 1 });
            }
            updateCartUI();
        };

        window.updateCartUI = function() {
            const count = document.getElementById('cart-count');
            const itemsContainer = document.getElementById('cart-items');
            const totalContainer = document.getElementById('cart-total');

            const totalQty = cart.reduce((acc, i) => acc + i.qty, 0);
            const totalPrice = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);

            count.innerText = totalQty;
            totalContainer.innerText = `R$ ${totalPrice.toFixed(2).replace('.', ',')}`;

            itemsContainer.innerHTML = '';
            if (cart.length === 0) {
                itemsContainer.innerHTML = `<p class="text-center text-slate-500 py-8 text-sm">Seu carrinho está vazio.</p>`;
                return;
            }

            cart.forEach(item => {
                itemsContainer.innerHTML += `
                    <div class="flex items-center gap-4 bg-slate-950 p-3 rounded-xl border border-slate-800">
                        <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg">
                        <div class="flex-1">
                            <h4 class="text-xs font-bold text-white">${item.name}</h4>
                            <p class="text-xs text-orange-500 font-bold">R$ ${item.price.toFixed(2).replace('.', ',')}</p>
                            <div class="flex items-center gap-2 mt-2">
                                <button onclick="changeQty(${item.id}, -1)" class="w-5 h-5 bg-slate-800 hover:bg-slate-700 text-white rounded flex items-center justify-center text-xs">-</button>
                                <span class="text-xs text-slate-300 font-bold">${item.qty}</span>
                                <button onclick="changeQty(${item.id}, 1)" class="w-5 h-5 bg-slate-800 hover:bg-slate-700 text-white rounded flex items-center justify-center text-xs">+</button>
                            </div>
                        </div>
                    </div>
                `;
            });
            if (window.lucide) lucide.createIcons();
        };

        window.changeQty = function(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
        };

        window.toggleCart = function() {
            const sidebar = document.getElementById('cart-sidebar');
            const overlay = document.getElementById('cart-overlay');
            sidebar.classList.toggle('translate-x-full');
            overlay.classList.toggle('hidden');
        };

        window.filterCategory = function(cat) {
            selectedCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.className = "cat-btn bg-slate-900 border border-slate-800 text-slate-400 hover:text-white text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap transition";
            });
            event.target.className = "cat-btn active bg-orange-600 text-white text-xs font-bold px-4 py-2 rounded-full whitespace-nowrap transition";
            renderProducts();
        };

        window.filterProducts = function() {
            renderProducts();
        };

        // Salvar Pedido no Firestore
        window.checkout = async function() {
            if (cart.length === 0) return alert("Seu carrinho está vazio!");
            if (!currentUser) return alert("Por favor, faça login para finalizar a compra.");

            const totalPrice = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);

            try {
                await addDoc(collection(db, "orders"), {
                    userId: currentUser.uid,
                    userEmail: currentUser.email,
                    items: cart,
                    total: totalPrice,
                    createdAt: serverTimestamp()
                });

                alert("Pedido realizado com sucesso! Registrado no Firebase.");
                cart = [];
                updateCartUI();
                toggleCart();
            } catch (error) {
                console.error("Erro ao salvar pedido:", error);
                alert("Ocorreu um erro ao processar o seu pedido.");
            }
        };

        renderProducts();
    </script>
</body>
</html>
